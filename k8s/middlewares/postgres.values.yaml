# =============================================================================
# Alephant — PostgreSQL 部署配置
# =============================================================================
# Chart: weconomy/cnpg-cluster (内部 Chart)
# 用法:
#   helm upgrade --install alephant-postgres weconomy/cnpg-cluster \
#     --version 0.1.0 \
#     --namespace alephant-prod \
#     --create-namespace \
#     -f k8s/middlewares/postgres.values.yaml
# =============================================================================

# 单节点最小验证环境。生产环境请至少 3 实例并重新开启同步副本/PDB。
instances: 1

image:
  repository: ghcr.io/cloudnative-pg/postgresql
  tag: "18.3"

postgresql:
  minSyncReplicas: 0
  maxSyncReplicas: 0

bootstrap:
  initdb:
    database: alephant
    owner: alephant
    # 部署前先创建同名 Secret，key 为 username/password，password 需与 start-k8s.sh 的 POSTGRES_PASSWORD 一致。
    secret: alephant-postgres-app

storage:
  storageClass: local-path            # k3s 默认 StorageClass
  size: 8Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

enablePDB: false
