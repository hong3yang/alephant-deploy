# =============================================================================
# Alephant — Qdrant 向量数据库 部署配置
# =============================================================================
# Chart: qdrant/qdrant (官方 Chart)
# 用法:
#   helm repo add qdrant https://qdrant.github.io/qdrant-helm/
#   helm upgrade --install alephant-prod-qdrant qdrant/qdrant \
#     --version 1.17.1 \
#     --namespace alephant-prod \
#     --create-namespace \
#     -f k8s/middlewares/qdrant.values.yaml \
#     --set-string config.service.api_key="$QDRANT_API_KEY"
# =============================================================================

# 单节点模式（适用于测试 / 开发）
replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  storageClassName: local-path            # k3s 默认 StorageClass
  size: 5Gi

config:
  cluster:
    enabled: false       # 单节点时关闭集群模式
  service:
    # 真实 API Key 通过 Helm --set-string config.service.api_key="$QDRANT_API_KEY" 注入。
    api_key: "CHANGE_ME"
