# =============================================================================
# Alephant — MinIO 部署 (兼容 docker-compose 的 pgsty/minio 镜像)
# =============================================================================
# 用法:
#   kubectl create secret generic alephant-minio-secret \
#     --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
#     --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
#     -n alephant-prod --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f k8s/middlewares/minio.values.yaml
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: alephant-minio
  namespace: alephant-prod
  labels:
    app: alephant-minio
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: alephant-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alephant-minio
  namespace: alephant-prod
  labels:
    app: alephant-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alephant-minio
  template:
    metadata:
      labels:
        app: alephant-minio
    spec:
      containers:
        - name: minio
          image: pgsty/minio:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: alephant-minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephant-minio-secret
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: alephant-minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alephant-minio
  namespace: alephant-prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
