# =============================================================================
# Alephant — ClickHouse 部署配置
# =============================================================================
# Chart: weconomy/clickhouse-cluster (内部 Chart, 基于 Altinity Operator)
# 依赖: 需提前安装 Altinity ClickHouse Operator
# 用法:
#   helm upgrade --install alephant-clickhouse weconomy/clickhouse-cluster \
#     --version 0.1.1 \
#     --namespace alephant-prod \
#     --create-namespace \
#     -f k8s/middlewares/clickhouse.values.yaml
# =============================================================================

nameOverride: ch

clickhouse:
  clusterName: main
  image:
    repository: clickhouse/clickhouse-server
    tag: "25.3"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    storageClassName: local-path            # k3s 默认 StorageClass
    size: 10Gi

layout:
  shardsCount: 1
  replicasCount: 1

keeper:
  enabled: true
  replicas: 1
  image:
    repository: clickhouse/clickhouse-keeper
    tag: "25.3-alpine"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    storageClassName: local-path            # k3s 默认 StorageClass
    size: 2Gi

# 用户密码 — 部署前务必修改
users:
  "default/password": "CHANGE_ME"           # ← 务必替换
  "default/profile": default
  "default/quota": default
  "default/networks/ip":
    - "10.42.0.0/16"                       # k3s 默认 Pod CIDR
    - "10.43.0.0/16"                       # k3s 默认 Service CIDR
    - "::1"
    - "127.0.0.1"

pdbMaxUnavailable: 1
podAntiAffinity: false
